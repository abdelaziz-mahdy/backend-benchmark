name: Dashboard checks

on:
  pull_request:
    paths:
      - 'benchmark-app/**'
      - 'bench/report/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install report dependencies
        run: pip install pyyaml

      - name: Generate dashboard data
        run: python bench/report/report.py

      - name: Resolve packages
        working-directory: benchmark-app
        run: flutter pub get

      - name: Format
        working-directory: benchmark-app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: benchmark-app
        run: flutter analyze

      - name: Test
        working-directory: benchmark-app
        run: flutter test

      - name: Build
        working-directory: benchmark-app
        run: flutter build web --base-href /backend-benchmark/
