services:
  benchmark:
    restart: always
    build:
      context: ./src
      dockerfile: ./Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: "curl --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://127.0.0.1:8000/"
      start_period: 10s
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${SERVICE_CPU_CORE_LIMIT:-1.0}"
  tester:
    image: locustio/locust
    volumes:
      - ./tests:/mnt/locust
      - ./tests/results/${test_type}:/home/locust/
    command: >
      -f /mnt/locust/${test_type}.py
      --csv benchmark
      --run-time ${LOCUST_RUNTIME}
      --headless
      --users ${LOCUST_USERS}
      --spawn-rate ${LOCUST_SPAWN_RATE}
      -H http://benchmark:8000
      ${LOCUST_ARGS}
      --master
    depends_on:
      benchmark:
        condition: service_healthy
  tester_worker:
    image: locustio/locust
    volumes:
      - ./tests:/mnt/locust
      - ./tests/results/${test_type}:/home/locust/
    command: >
      -f /mnt/locust/${test_type}.py
      --worker --master-host tester
    depends_on:
      benchmark:
        condition: service_healthy
