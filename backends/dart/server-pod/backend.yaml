name: serverpod
language: dart
framework: serverpod
version: "4.1.1"
runtime: dart 3.14
# Older releases benchmarked alongside, for the version history.
history:
  - version: "4.0.3"
variants:
  - id: postgres
    db: postgres
    # Keeps the key "dart-server-pod", so earlier results stay linked.
    suffix: false
  # Serverpod 4.1.1 pins relic 2.0.0-rc.4 and serves through relic_io.
  # These two move it to the final Relic 2.0.0 (app/tool/relic2.sh).
  - id: relic-2.0.0
    db: postgres
    history: false
    notes: "Serverpod 4.1.1 with Relic overridden to the final 2.0.0 release, still served through relic_io. One Dart isolate, like the default build."
  - id: relic-native-2.0.0
    db: postgres
    history: false
    notes: "Serverpod 4.1.1 on Relic 2.0.0, patched to serve through relic_native (app.serveNative); Serverpod itself has no option for it. One Dart isolate."
  - id: relic-native-fixed-2.0.0
    db: postgres
    history: false
    notes: "As relic-native-2.0.0, with relic_native's drain fix: it parks instead of lingering 1 ms while handlers wait on the database. One Dart isolate."
# Serverpod is called through its RPC API (POST /note/<method>).
api_style: serverpod_rpc
health_path: /
notes: Runs one Dart isolate, so it uses a single core of the two assigned.
# How this backend is run and talks to the database; shown on the dashboard.
implementation:
  server: "Serverpod 4 built-in server (production mode, monolith role)"
  concurrency: "one Dart isolate, single-threaded event loop (uses one core)"
  db_access: "Serverpod ORM over its own Postgres driver"
  pool: "20 (database.maxConnectionCount)"
