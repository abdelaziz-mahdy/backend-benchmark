# Benchmark configuration: the API server listens on 8000 and talks to the
# shared Postgres service "db" without SSL. Insights and web servers are not
# used by the benchmark.
apiServer:
  port: 8000
  publicHost: benchmark
  publicPort: 8000
  publicScheme: http

insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

database:
  host: db
  port: 5432
  name: postgres
  user: postgres
  requireSsl: false
  maxConnectionCount: 20

redis:
  enabled: false
  host: redis
  port: 6379

sessionLogs:
  persistentEnabled: false
  consoleEnabled: false
