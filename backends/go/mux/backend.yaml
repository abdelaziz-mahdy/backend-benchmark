name: go mux
language: go
framework: gorilla/mux
version: "1.8.1"
runtime: go 1.27
variants:
  - id: postgres
    db: postgres
# How this backend is run and talks to the database; shown on the dashboard.
implementation:
  server: "net/http with gorilla/mux"
  concurrency: "goroutine per request, Go scheduler on both cores"
  db_access: "database/sql with lib/pq, hand-written SQL"
  pool: "20 (SetMaxOpenConns / SetMaxIdleConns)"
